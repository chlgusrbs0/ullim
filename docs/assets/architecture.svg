<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">울림 시스템 아키텍처</title>
  <desc id="desc">워치 마이크 입력에서 오디오 전처리와 분배, DSP 및 비동기 YAMNet 환경음 분류, 하이브리드 촉각 매핑, 진동 출력으로 이어지는 핵심 데이터 흐름.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#526986"/></marker>
  </defs>
  <rect x="20" y="14" width="680" height="414" rx="16" fill="#F5F8FC" stroke="#A5B6CC" stroke-width="1.5" stroke-dasharray="6 5"/>
  <g font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', sans-serif" fill="#14243A">
    <text x="42" y="40" font-size="16" font-weight="600">Galaxy Watch7 · Wear OS</text>
    <g fill="#FFFFFF" stroke="#9DB3CF" stroke-width="1.5">
      <rect x="230" y="54" width="260" height="60" rx="10"/>
      <rect x="230" y="134" width="260" height="50" rx="10"/>
      <rect x="77" y="216" width="254" height="66" rx="10" fill="#E6EFFD" stroke="#7D9ECC"/>
      <rect x="389" y="216" width="254" height="66" rx="10" fill="#E6EFFD" stroke="#7D9ECC"/>
      <rect x="230" y="315" width="260" height="50" rx="10"/>
      <rect x="230" y="385" width="260" height="31" rx="8" fill="#14243A" stroke="#14243A"/>
    </g>
    <g text-anchor="middle" font-size="17" font-weight="600">
      <text x="360" y="78">마이크 입력</text>
      <text x="360" y="165">오디오 전처리 · 분배</text>
      <text x="204" y="242">디지털 신호 처리</text>
      <text x="516" y="242">환경음 분류</text>
      <text x="360" y="346">하이브리드 촉각 매핑</text>
      <text x="360" y="406" fill="#FFFFFF" font-size="16">진동 출력</text>
    </g>
    <g text-anchor="middle" fill="#526986" font-size="14">
      <text x="360" y="99">AudioRecord</text>
      <text x="204" y="264">DSP</text>
      <text x="516" y="264">YAMNet · LiteRT</text>
    </g>
    <g stroke="#526986" stroke-width="2" stroke-linejoin="round" fill="none" marker-end="url(#arrow)">
      <path d="M360 114 V134"/>
      <path d="M360 184 V200 H204 V216"/>
      <path d="M360 184 V200 H516 V216"/>
      <path d="M204 282 V299 H310 V315"/>
      <path d="M516 282 V299 H410 V315" stroke-dasharray="5 4"/>
      <path d="M360 365 V385"/>
