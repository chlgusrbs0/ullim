    <rect x="20" y="438" width="680" height="32" rx="8" fill="#F5F8FC" stroke="#A5B6CC"/>
    <g stroke="#526986" stroke-width="2" fill="none">
      <path d="M86 454 H119"/>
      <path d="M387 454 H420" stroke-dasharray="5 4"/>
    </g>
    <g font-size="13" fill="#34465E">
      <text x="129" y="459">기본 신호 처리</text>
      <text x="430" y="459">비동기 AI 보조</text>
